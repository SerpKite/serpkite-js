# Mirrored from the SerpKite monorepo (sdks/typescript); edits here are overwritten.
# The monorepo's sdk-mirror workflow pushes tag vX.Y.Z here; this publishes npm `serpkite`.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json and VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "${TAG#v}" = "$(node -p 'require("./package.json").version')"
          grep -q "^export const VERSION = \"${TAG#v}\"" src/client.ts
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # Trusted publishing (OIDC) needs npm >= 11.5.1. NPM_TOKEN is only for the
      # very first publish, before the package exists on npm and can trust this repo.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
